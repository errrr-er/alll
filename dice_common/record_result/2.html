<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoC Log 解析器</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f6f3;
  --card-bg:#ffffff;
  --text:#2c2416;
  --text-secondary:#5f5542;
  --text-muted:#b8aa94;
  --border:#d9cebb;
  --shadow:0 2px 12px rgba(60,40,20,0.06);
  --radius:10px;
  --radius-sm:6px;
  --accent:#7d5d3c;
  --font-mono:'SF Mono','Cascadia Code','Consolas','Menlo','PingFang SC','Microsoft YaHei',monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;

  --crit-bg:#e1f5ee;--crit-c:#085041;
  --extreme-bg:#e6f1fb;--extreme-c:#0c447c;
  --hard-bg:#eeedfe;--hard-c:#3c3489;
  --success-bg:#eaf3de;--success-c:#3b6d11;
  --fail-bg:#faeeda;--fail-c:#633806;
  --fumble-bg:#fcebeb;--fumble-c:#791f1f;
}

body{
  margin:0;
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  padding:20px;
}

.page{max-width:1200px;margin:0 auto;}

.header{margin-bottom:20px;}
.header h1{font-size:1.4rem;font-weight:600;color:#3d2e1c;letter-spacing:.03em;}
.header p{font-size:.85rem;color:var(--text-secondary);margin-top:2px;}

.layout{
  display:grid;
  grid-template-columns:420px 1fr;
  gap:20px;
  align-items:start;
}

.left{display:flex;flex-direction:column;gap:12px;}

.drop-zone{
  background:var(--card-bg);
  border:1.5px dashed var(--border);
  border-radius:var(--radius);
  padding:20px 16px;
  text-align:center;
  cursor:pointer;
  font-size:13px;
  color:var(--text-secondary);
  box-shadow:var(--shadow);
  transition:border-color .15s,background .15s,color .15s;
}
.drop-zone:hover,.drop-zone.dragover{
  border-color:var(--accent);
  background:#fdf7f0;
  color:var(--accent);
}

.section-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.section-head{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  font-weight:600;
  font-size:.88rem;
  color:#3d2e1c;
  background:#faf7f2;
  display:flex;
  justify-content:space-between;
}

.card-list{
  max-height:480px;
  overflow-y:auto;
  padding:8px;
}

.card{
  background:#fefcf8;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:9px 12px;
  cursor:pointer;
  margin-bottom:6px;
}

.card:hover{border-color:var(--accent);background:#fdf7f0;}

.rank{
  font-size:11px;
  padding:2px 9px;
  border-radius:999px;
}

.r-crit{background:var(--crit-bg);color:var(--crit-c);}
.r-extreme{background:var(--extreme-bg);color:var(--extreme-c);}
.r-hard{background:var(--hard-bg);color:var(--hard-c);}
.r-success{background:var(--success-bg);color:var(--success-c);}
.r-fail{background:var(--fail-bg);color:var(--fail-c);}
.r-fumble{background:var(--fumble-bg);color:var(--fumble-c);}

.right{position:sticky;top:20px;}

.log-view{
  height:560px;
  overflow-y:auto;
  font-family:var(--font-mono);
  font-size:12px;
  padding:10px;
  background:#fefcf8;
  white-space:pre-wrap;
}

.log-line{display:block;}
.log-line.hl{background:#fef08a;}
</style>
</head>

<body>

<div class="page">

<div class="header">
  <h1>CoC Log 解析器</h1>
  <p>载入跑团 log，自动提取检定记录</p>
</div>

<div class="layout">

  <div class="left">

    <div class="drop-zone" id="dropZone">
      点击选择或拖入 log 文件
      <input type="file" id="fileInput" hidden>
    </div>

    <div class="section-card">
      <div class="section-head">
        检定记录 <span id="countBadge">-</span>
      </div>
      <div class="card-list" id="out"></div>
    </div>

  </div>

  <div class="right">
    <div class="log-view" id="logView"></div>
  </div>

</div>
</div>

<script>

/* =========================
   UI引用（不动）
========================= */
const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
const out=document.getElementById('out');
const logView=document.getElementById('logView');
const countBadge=document.getElementById('countBadge');

let lineEls=[];
let activeCard=null;

/* =========================
   文件读取（不动）
========================= */
dropZone.onclick=()=>fileInput.click();

fileInput.onchange=e=>{
  if(e.target.files[0]) load(e.target.files[0]);
};

dropZone.ondragover=e=>e.preventDefault();

dropZone.ondrop=e=>{
  e.preventDefault();
  load(e.dataTransfer.files[0]);
};

function load(file){
  const r=new FileReader();
  r.onload=e=>{
    const lines=e.target.result.split('\n');
    renderLog(lines);
    parse(lines);
  };
  r.readAsText(file,'utf-8');
}

/* =========================
   log渲染（不动）
========================= */
function renderLog(lines){
  logView.innerHTML='';
  lineEls=[];
  lines.forEach((l,i)=>{
    const s=document.createElement('span');
    s.className='log-line';
    s.textContent=l||' ';
    logView.appendChild(s);
    lineEls.push(s);
  });
}

/* =========================
   高亮
========================= */
function highlight(idx,card){
  lineEls.forEach(el=>el.classList.remove('hl'));
  const el=lineEls[idx];
  if(!el) return;
  el.classList.add('hl');
  el.scrollIntoView({behavior:'smooth',block:'center'});
}

/* =========================
   ✔ 解析增强核心
========================= */

const rankPriority=["大成功","极难成功","困难成功","成功","失败","大失败"];

function normalizeRank(t){
  t=(t||'').replace(/\s+/g,'');
  for(let r of rankPriority){
    if(t.includes(r)) return r;
  }
  return "未知";
}

/* ✔ 技能 alias */
const skillAlias={
  "力量":["STR","str"],
  "敏捷":["DEX","dex"],
  "体质":["CON","con"],
  "意志":["POW","pow"],
  "外貌":["APP","app"],
  "智力":["INT","int","灵感"],
  "教育":["EDU","edu"],
  "体型":["SIZ","siz"],
  "理智":["SAN","san","san值","理智值"],
  "幸运":["幸运"]
};

function normalizeSkill(n){
  if(!n) return "未知检定";
  let c=n.replace(/\s*\d+$/,'');

  for(let [k,v] of Object.entries(skillAlias)){
    if(c===k) return k;
    if(v.includes(c)) return k;
  }
  return c;
}

/* ✔ 技能提取 */
function extractSkill(line){
  let m=line.match(/"([^"]+)"/);
  if(m) return normalizeSkill(m[1]);

  m=line.match(/([^\s"：:]+)\s*检定/);
  if(m) return normalizeSkill(m[1]);

  return "未知检定";
}

/* ✔ SC识别 */
function isSC(line){
  return line.includes("理智检定");
}

/* ✔ dice解析 */
function parseDice(line){

  let m=line.match(/[pb]=(\d+)\/(\d+),\s*\((\d+)\[D100=.*?\]\)\s*(.*)/);
  if(m){
    return {roll:+m[3],target:+m[2],rank:normalizeRank(m[4])};
  }

  m=line.match(/D100=(\d+)\/(\d+)\s*(.*)/);
  if(m){
    return {roll:+m[1],target:+m[2],rank:normalizeRank(m[3])};
  }

  return null;
}

/* =========================
   主解析（核心）
========================= */
function parse(lines){

  const events=[];

  lines.forEach((line,i)=>{

    if(!line.includes("D100=")) return;

    /* SC */
    if(isSC(line)){
      const m=line.match(/D100=(\d+)\/(\d+)\s*(.*)/);
      if(m){
        events.push({
          i,
          skill:"理智检定",
          roll:+m[1],
          target:+m[2],
          rank:normalizeRank(m[3])
        });
      }
      return;
    }

    const d=parseDice(line);
    if(!d) return;

    events.push({
      i,
      skill:extractSkill(line),
      roll:d.roll,
      target:d.target,
      rank:d.rank
    });

  });

  renderCards(events);
}

/* =========================
   UI渲染
========================= */
function renderCards(events){

  out.innerHTML='';
  countBadge.textContent=events.length;

  events.forEach(e=>{

    const cls=
      e.rank==="大成功"?"r-crit":
      e.rank==="极难成功"?"r-extreme":
      e.rank==="困难成功"?"r-hard":
      e.rank==="成功"?"r-success":
      e.rank==="失败"?"r-fail":"r-fumble";

    const div=document.createElement('div');
    div.className='card';

    div.innerHTML=`
      <div>${e.skill}</div>
      <div class="rank ${cls}">${e.rank}</div>
      <div>D100=${e.roll}/${e.target}</div>
    `;

    div.onclick=()=>highlight(e.i,div);
    out.appendChild(div);
  });
}

</script>

</body>
</html>
