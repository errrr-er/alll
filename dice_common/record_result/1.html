<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoC Log 解析器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f6f3;
  --card-bg:#ffffff;
  --text:#2c2416;
  --text-secondary:#5f5542;
  --text-muted:#b8aa94;
  --border:#d9cebb;
  --shadow:0 2px 12px rgba(60,40,20,0.06);
  --radius:10px;
  --radius-sm:6px;
  --accent:#7d5d3c;
  --font-mono:'SF Mono','Cascadia Code','Consolas','Menlo','PingFang SC','Microsoft YaHei',monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;

  --crit-bg:#e1f5ee;--crit-c:#085041;
  --extreme-bg:#e6f1fb;--extreme-c:#0c447c;
  --hard-bg:#eeedfe;--hard-c:#3c3489;
  --success-bg:#eaf3de;--success-c:#3b6d11;
  --fail-bg:#faeeda;--fail-c:#633806;
  --fumble-bg:#fcebeb;--fumble-c:#791f1f;
}

body{
  margin:0;
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  padding:20px;
}

.page{max-width:1200px;margin:0 auto;}

.header{margin-bottom:20px;}
.header h1{font-size:1.4rem;font-weight:600;color:#3d2e1c;letter-spacing:.03em;}
.header p{font-size:.85rem;color:var(--text-secondary);margin-top:2px;}

.layout{
  display:grid;
  grid-template-columns:420px 1fr;
  gap:20px;
  align-items:start;
}

/* left panel */
.left{display:flex;flex-direction:column;gap:12px;}

.drop-zone{
  background:var(--card-bg);
  border:1.5px dashed var(--border);
  border-radius:var(--radius);
  padding:20px 16px;
  text-align:center;
  cursor:pointer;
  font-size:13px;
  color:var(--text-secondary);
  box-shadow:var(--shadow);
  transition:border-color .15s,background .15s,color .15s;
}
.drop-zone:hover,.drop-zone.dragover{
  border-color:var(--accent);
  background:#fdf7f0;
  color:var(--accent);
}
.drop-zone .icon{font-size:24px;margin-bottom:6px;display:block;}

/* section card */
.section-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.section-head{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  font-weight:600;
  font-size:.88rem;
  color:#3d2e1c;
  background:#faf7f2;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.section-head .count{
  font-size:.78rem;
  font-weight:500;
  background:#eee4d5;
  color:#5f4e34;
  padding:2px 8px;
  border-radius:12px;
}

.card-list{
  max-height:480px;
  overflow-y:auto;
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.card{
  background:#fefcf8;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:9px 12px;
  cursor:pointer;
  transition:border-color .12s,background .12s;
}
.card:hover{border-color:var(--accent);background:#fdf7f0;}
.card.active-card{border-color:var(--accent);background:#fdf7f0;}

.card-header{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-actor{font-size:13px;font-weight:600;color:var(--text);}
.card-roll{font-size:12px;color:var(--text-secondary);margin-top:3px;font-family:var(--font-mono);}

.rank{
  font-size:11px;
  padding:2px 9px;
  border-radius:999px;
  white-space:nowrap;
  flex-shrink:0;
  font-weight:500;
}
.r-crit{background:var(--crit-bg);color:var(--crit-c);}
.r-extreme{background:var(--extreme-bg);color:var(--extreme-c);}
.r-hard{background:var(--hard-bg);color:var(--hard-c);}
.r-success{background:var(--success-bg);color:var(--success-c);}
.r-fail{background:var(--fail-bg);color:var(--fail-c);}
.r-fumble{background:var(--fumble-bg);color:var(--fumble-c);}

.empty{
  color:var(--text-muted);
  font-size:13px;
  text-align:center;
  padding:40px 0;
}

/* log panel */
.right{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px;}

.log-wrap{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.log-head{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  font-weight:600;
  font-size:.88rem;
  color:#3d2e1c;
  background:#faf7f2;
}
.log-view{
  height:560px;
  overflow-y:auto;
  font-family:var(--font-mono);
  font-size:12px;
  padding:10px 12px;
  color:var(--text-secondary);
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-all;
  background:#fefcf8;
}
.log-line{display:block;padding:0 2px;border-radius:3px;}
.log-line.hl{background:#fef08a;color:#713f12;}
.log-line.active{background:#f0e8d8;color:#3d2e1c;font-weight:500;}

.log-hint{
  color:var(--text-muted);
  font-size:13px;
  font-family:var(--font-sans);
  padding:20px;
}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;}
  .right{position:static;}
}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>CoC Log 解析器</h1>
    <p>载入跑团 log，自动提取检定记录，点击卡片可定位至原文</p>
  </div>

  <div class="layout">

    <div class="left">

      <div class="drop-zone" id="dropZone">
        <span class="icon">📂</span>
        点击选择或拖入 log 文件
        <input type="file" id="fileInput" hidden>
      </div>

      <div class="section-card">
        <div class="section-head">
          检定记录
          <span class="count" id="countBadge">-</span>
        </div>
        <div class="card-list" id="out">
          <div class="empty">载入 log 后显示检定结果</div>
        </div>
      </div>

    </div>

    <div class="right">
      <div class="log-wrap">
        <div class="log-head">原始 log</div>
        <div class="log-view" id="logView">
          <span class="log-hint">载入 log 文件后在此显示……</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const RANKS=['大成功','极难成功','困难成功','成功','失败','大失败'];
const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
const out=document.getElementById('out');
const logView=document.getElementById('logView');
const countBadge=document.getElementById('countBadge');
let lineEls=[];
let activeCard=null;

dropZone.onclick=()=>fileInput.click();
fileInput.onchange=e=>{if(e.target.files[0])load(e.target.files[0])};
dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('dragover')};
dropZone.ondragleave=()=>dropZone.classList.remove('dragover');
dropZone.ondrop=e=>{
  e.preventDefault();dropZone.classList.remove('dragover');
  load(e.dataTransfer.files[0]);
};

function load(file){
  const r=new FileReader();
  r.onload=e=>{
    const lines=e.target.result.split('\n');
    renderLog(lines);
    parse(lines);
  };
  r.readAsText(file,'utf-8');
}

function renderLog(lines){
  logView.innerHTML='';
  lineEls=[];
  lines.forEach((l,i)=>{
    const s=document.createElement('span');
    s.className='log-line';
    s.textContent=l||' ';
    logView.appendChild(s);
    lineEls.push(s);
  });
}

function highlight(idx,card){
  lineEls.forEach(el=>el.classList.remove('hl','active'));
  if(activeCard) activeCard.classList.remove('active-card');
  const el=lineEls[idx];
  if(!el)return;
  el.classList.add('hl','active');
  el.scrollIntoView({behavior:'smooth',block:'center'});
  if(card){card.classList.add('active-card');activeCard=card;}
}

function rank(t){return RANKS.find(r=>t.includes(r))}
function player(t){const m=t.match(/<([^>]+)>/);return m?m[1]:'未知'}
function skill(t){
  const m=t.match(/"([^"]+)"/);if(m)return m[1];
  const m2=t.match(/(\S{1,10})检定/);return m2?m2[1]:'未知';
}

function parse(lines){
  const events=[];
  lines.forEach((line,i)=>{
    if(!line.includes('D100='))return;
    const m=line.match(/D100=(\d+)\/(\d+)/);
    if(!m)return;
    events.push({i,player:player(line),skill:skill(line),rank:rank(line),roll:+m[1],target:+m[2]});
  });
  renderCards(events);
}

function renderCards(events){
  out.innerHTML='';
  if(!events.length){
    countBadge.textContent='0';
    out.innerHTML='<div class="empty">未找到检定记录</div>';
    return;
  }
  countBadge.textContent=events.length;
  events.forEach(e=>{
    const cls=
      e.rank==='大成功'?'r-crit':
      e.rank==='极难成功'?'r-extreme':
      e.rank==='困难成功'?'r-hard':
      e.rank==='成功'?'r-success':
      e.rank==='失败'?'r-fail':'r-fumble';
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <div class="card-header">
        <span class="card-actor">${e.player} · ${e.skill}</span>
        <span class="rank ${cls}">${e.rank||'未知'}</span>
      </div>
      <div class="card-roll">D100 = ${e.roll} / ${e.target}</div>
    `;
    div.onclick=()=>highlight(e.i,div);
    out.appendChild(div);
  });
}
</script>
</body>
</html>
