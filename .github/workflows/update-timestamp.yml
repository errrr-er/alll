name: Update Timestamp

on:
  push:
    paths:
      - 'dice/sealpack/countlog/scripts/countlog.js'
      - 'dice/sealpack/er_update/scripts/er-update.js'
      - 'dice/sealpack/pt_plan/scripts/ptplan.js'
      - 'dice/sealpack/silence/scripts/a_silence.js'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Timestamp
        id: update
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          # ==========================================
          # 配对配置：以后新增文件对，在这里添加即可
          # ==========================================

          PAIRS = [
              {
                  "name": "countlog",
                  "js": "dice/sealpack/countlog/scripts/countlog.js",
                  "toml": "dice/sealpack/countlog/info.toml",
              },

              {
                  "name": "er_update",
                  "js": "dice/sealpack/er_update/scripts/er-update.js",
                  "toml": "dice/sealpack/er_update/info.toml",
              },

              {
                  "name": "pt_plan",
                  "js": "dice/sealpack/pt_plan/scripts/ptplan.js",
                  "toml": "dice/sealpack/pt_plan/info.toml",
              },

              {
                  "name": "silence",
                  "js": "dice/sealpack/silence/scripts/a_silence.js",
                  "toml": "dice/sealpack/silence/info.toml",
              },
          ]

          BRANCH = "automation/update-timestamp"

          def git(*args, check=True):
              return subprocess.run(
                  ["git", *args],
                  check=check,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              ).stdout

          def read_ref(ref, path):
              result = subprocess.run(
                  ["git", "show", f"{ref}:{path}"],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              return result.stdout if result.returncode == 0 else None

          def normalize_js(content):
              # 只去掉 @timestamp，避免自己改自己形成死循环。
              # @updateUrl 保留：改镜像算业务变化，要 bump version。
              if content is None:
                  return None
              return re.sub(
                  r"(?m)^[ \t]*//[ \t]*@timestamp\b.*(?:\n|$)",
                  "",
                  content,
              )

          def get_js_timestamp(content):
              match = re.search(
                  r"(?m)^[ \t]*//[ \t]*@timestamp\b[ \t]*[:=]?[ \t]*(.*?)\s*$",
                  content,
              )
              if not match:
                  raise ValueError(
                      "找不到 JS 的 // @timestamp：" + "请检查文件格式"
                  )
              return match.group(1)

          def set_js_timestamp(content, timestamp):
              pattern = r"(?m)^([ \t]*//[ \t]*@timestamp\b[ \t]*[:=]?[ \t]*).*$"
              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + timestamp,
                  content,
                  count=1,
              )
              if count != 1:
                  raise ValueError("JS timestamp 字段不存在或格式不正确")
              return updated

          def get_toml_field(content, section, key):
              pattern = (
                  r"(?ms)^\[" + re.escape(section) + r"\][ \t]*\n"
                  r"(.*?)(?=^\[|\Z)"
              )
              match = re.search(pattern, content)
              if not match:
                  raise ValueError("TOML section 不存在: " + section)

              field = re.search(
                  r'(?m)^[ \t]*' + re.escape(key)
                  + r'[ \t]*=[ \t]*"([^"]*)"',
                  match.group(1),
              )
              if not field:
                  raise ValueError(
                      f"TOML 字段不存在: [{section}] {key}"
                  )
              return field.group(1)

          def set_toml_field(content, section, key, value):
              pattern = (
                  r"(?ms)^(\[" + re.escape(section) + r"\][ \t]*\n)"
                  r"(.*?)(?=^\[|\Z)"
              )
              match = re.search(pattern, content)
              if not match:
                  raise ValueError("TOML section 不存在: " + section)

              body, count = re.subn(
                  r'(?m)^([ \t]*' + re.escape(key)
                  + r'[ \t]*=[ \t]*)"[^"]*"',
                  lambda m: m.group(1) + '"' + value + '"',
                  match.group(2),
                  count=1,
              )
              if count != 1:
                  raise ValueError(
                      f"TOML 字段不存在: [{section}] {key}"
                  )

              return (
                  content[:match.start()]
                  + match.group(1)
                  + body
                  + content[match.end():]
              )

          def increment_version(version):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not match:
                  raise ValueError(
                      f"不支持的 version 格式: {version}"
                  )

              major, minor, patch = map(int, match.groups())
              patch += 1

              if patch > 9:
                  patch = 0
                  minor += 1

              if minor > 9:
                  minor = 0
                  major += 1

              return f"{major}.{minor}.{patch}"

          before = os.environ.get("BEFORE", "")
          after = os.environ.get("AFTER", "HEAD")

          # 获取本次 push 涉及的文件。
          if not before or set(before) == {"0"}:
              changed_paths = set()
          else:
              output = git(
                  "diff", "--name-only", before, after
              )
              changed_paths = set(output.splitlines())

          # 只处理 JS 业务内容实际变化的文件对。
          # @timestamp 变化不算业务变化；
          # @updateUrl 变化算业务变化。
          changed_groups = set()

          for pair in PAIRS:
              if pair["js"] not in changed_paths:
                  continue

              old = read_ref(before, pair["js"])
              new = read_ref(after, pair["js"])

              if old is None or new is None:
                  changed_groups.add(pair["name"])
              elif normalize_js(old) != normalize_js(new):
                  changed_groups.add(pair["name"])

          # 查找已有 PR 分支，保留尚未合并的文件对。
          subprocess.run(
              [
                  "git", "fetch", "origin",
                  f"refs/heads/{BRANCH}:refs/remotes/origin/{BRANCH}",
              ],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          branch_exists = subprocess.run(
              ["git", "rev-parse", "--verify",
               f"refs/remotes/origin/{BRANCH}"],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          ).returncode == 0

          pending_groups = set()

          if branch_exists:
              for pair in PAIRS:
                  js_main = read_ref("HEAD", pair["js"])
                  toml_main = read_ref("HEAD", pair["toml"])
                  js_pr = read_ref(
                      f"origin/{BRANCH}", pair["js"]
                  )
                  toml_pr = read_ref(
                      f"origin/{BRANCH}", pair["toml"]
                  )

                  if None in (js_main, toml_main, js_pr, toml_pr):
                      continue

                  main_meta = (
                      get_js_timestamp(js_main),
                      get_toml_field(
                          toml_main, "package", "version"
                      ),
                      get_toml_field(
                          toml_main, "config.update_timestamp",
                          "default"
                      ),
                  )

                  pr_meta = (
                      get_js_timestamp(js_pr),
                      get_toml_field(
                          toml_pr, "package", "version"
                      ),
                      get_toml_field(
                          toml_pr, "config.update_timestamp",
                          "default"
                      ),
                  )

                  if main_meta != pr_meta:
                      pending_groups.add(pair["name"])

          # 没有新业务变化，也没有待保留的 PR 内容时，直接结束。
          selected = changed_groups | pending_groups

          if not selected:
              print("没有需要更新的文件对。")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("has_changes=false\n")
              raise SystemExit(0)

          # 统一使用 Unix 秒时间戳。
          timestamp = str(int(time.time()))

          for pair in PAIRS:
              if pair["name"] not in selected:
                  continue

              js_path = Path(pair["js"])
              toml_path = Path(pair["toml"])

              js = js_path.read_text(encoding="utf-8")
              toml = toml_path.read_text(encoding="utf-8")

              # 新业务修改使用最新 timestamp。
              # 仅为保留已有 PR 的文件对，沿用其 timestamp。
              if pair["name"] in changed_groups:
                  ts = timestamp
              elif branch_exists:
                  js_pr = read_ref(
                      f"origin/{BRANCH}", pair["js"]
                  )
                  ts = get_js_timestamp(js_pr)
              else:
                  ts = timestamp

              js = set_js_timestamp(js, ts)

              # version 始终以 main 当前版本为基准，
              # 不因同一 PR 的多次更新反复递增。
              main_toml = read_ref("HEAD", pair["toml"])
              main_version = get_toml_field(
                  main_toml, "package", "version"
              )
              new_version = increment_version(main_version)

              toml = set_toml_field(
                  toml, "package", "version", new_version
              )
              toml = set_toml_field(
                  toml, "config.update_timestamp",
                  "default", ts
              )

              js_path.write_text(js, encoding="utf-8")
              toml_path.write_text(toml, encoding="utf-8")

              print(
                  f"{pair['name']}: "
                  f"version={new_version}, timestamp={ts}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("has_changes=true\n")
          PY

      - name: Create or update PR
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/update-timestamp
          delete-branch: true
          title: "chore: update Timestamp"
          commit-message: "chore: update timestamps and versions"
          add-paths: |
            dice/sealpack/countlog/scripts/countlog.js
            dice/sealpack/countlog/info.toml
            dice/sealpack/er_update/scripts/er-update.js
            dice/sealpack/er_update/info.toml
            dice/sealpack/pt_plan/scripts/ptplan.js
            dice/sealpack/pt_plan/info.toml
            dice/sealpack/silence/scripts/a_silence.js
            dice/sealpack/silence/info.toml
          body: |
            Automatically updates Timestamp for changed JS files.
            Please review before merging.