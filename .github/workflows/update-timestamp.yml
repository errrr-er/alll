name: Update Timestamp

on:
  push:
    paths:
      - 'dice/sealpack/countlog/scripts/countlog.js'
      - 'dice/sealpack/er_update/scripts/er-update.js'
      - 'dice/sealpack/pt_plan/scripts/ptplan.js'
      - 'dice/sealpack/silence/scripts/a_silence.js'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Timestamp
        id: update
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          PAIRS = [
              {"name": "countlog",  "js": "dice/sealpack/countlog/scripts/countlog.js",   "toml": "dice/sealpack/countlog/info.toml"},
              {"name": "er_update", "js": "dice/sealpack/er_update/scripts/er-update.js", "toml": "dice/sealpack/er_update/info.toml"},
              {"name": "pt_plan",   "js": "dice/sealpack/pt_plan/scripts/ptplan.js",      "toml": "dice/sealpack/pt_plan/info.toml"},
              {"name": "silence",   "js": "dice/sealpack/silence/scripts/a_silence.js",   "toml": "dice/sealpack/silence/info.toml"},
          ]

          BRANCH = "automation/update-timestamp"

          def git(*args, check=True):
              return subprocess.run(
                  ["git", *args], check=check, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              ).stdout

          def read_ref(ref, path):
              result = subprocess.run(
                  ["git", "show", f"{ref}:{path}"], text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              )
              return result.stdout if result.returncode == 0 else None

          def normalize_js(content):
              if content is None:
                  return None
              return re.sub(
                  r"(?m)^[ \t]*//[ \t]*@timestamp\b.*(?:\n|$)",
                  "", content,
              )

          def get_js_timestamp(content):
              match = re.search(
                  r"(?m)^[ \t]*//[ \t]*@timestamp\b[ \t]*[:=]?[ \t]*(.*?)\s*$",
                  content,
              )
              if not match:
                  raise ValueError("JS 缺少 // @timestamp")
              return match.group(1)

          def set_js_timestamp(content, timestamp):
              pattern = r"(?m)^([ \t]*//[ \t]*@timestamp\b[ \t]*[:=]?[ \t]*).*$"
              updated, count = re.subn(
                  pattern, lambda m: m.group(1) + timestamp,
                  content, count=1,
              )
              if count != 1:
                  raise ValueError("JS timestamp 字段不存在或格式不正确")
              return updated

          def get_toml_field(content, section, key):
              pattern = (
                  r"(?ms)^\[" + re.escape(section) + r"\][ \t]*\n"
                  r"(.*?)(?=^\[|\Z)"
              )
              match = re.search(pattern, content)
              if not match:
                  raise ValueError(f"TOML section 不存在: [{section}]")

              field = re.search(
                  r'(?m)^[ \t]*' + re.escape(key) + r'[ \t]*=[ \t]*"([^"]*)"',
                  match.group(1),
              )
              if not field:
                  raise ValueError(f"TOML 字段不存在: [{section}] {key}")
              return field.group(1)

          def set_toml_field(content, section, key, value):
              pattern = (
                  r"(?ms)^(\[" + re.escape(section) + r"\][ \t]*\n)"
                  r"(.*?)(?=^\[|\Z)"
              )
              match = re.search(pattern, content)
              if not match:
                  raise ValueError(f"TOML section 不存在: [{section}]")

              body, count = re.subn(
                  r'(?m)^([ \t]*' + re.escape(key) + r'[ \t]*=[ \t]*)"[^"]*"',
                  lambda m: m.group(1) + '"' + value + '"',
                  match.group(2), count=1,
              )
              if count != 1:
                  raise ValueError(f"TOML 字段不存在: [{section}] {key}")

              return (
                  content[:match.start()]
                  + match.group(1)
                  + body
                  + content[match.end():]
              )

          def increment_version(version):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not match:
                  raise ValueError(f"不支持的 version 格式: {version}")
              major, minor, patch = map(int, match.groups())
              patch += 1
              if patch > 9:
                  patch = 0
                  minor += 1
              if minor > 9:
                  minor = 0
                  major += 1
              return f"{major}.{minor}.{patch}"

          before = os.environ.get("BEFORE", "")
          after = os.environ.get("AFTER", "HEAD")

          if not before or set(before) == {"0"}:
              changed_paths = set()
          else:
              output = git("diff", "--name-only", before, after)
              changed_paths = set(output.splitlines())

          changed_groups = set()
          for pair in PAIRS:
              if pair["js"] not in changed_paths:
                  continue
              old = read_ref(before, pair["js"])
              new = read_ref(after, pair["js"])
              if old is None or new is None:
                  changed_groups.add(pair["name"])
              elif normalize_js(old) != normalize_js(new):
                  changed_groups.add(pair["name"])

          subprocess.run(
              ["git", "fetch", "origin",
               f"refs/heads/{BRANCH}:refs/remotes/origin/{BRANCH}"],
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          )

          branch_exists = subprocess.run(
              ["git", "rev-parse", "--verify",
               f"refs/remotes/origin/{BRANCH}"],
              stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          ).returncode == 0

          pending_groups = set()
          if branch_exists:
              for pair in PAIRS:
                  js_main = read_ref("HEAD", pair["js"])
                  toml_main = read_ref("HEAD", pair["toml"])
                  js_pr = read_ref(f"origin/{BRANCH}", pair["js"])
                  toml_pr = read_ref(f"origin/{BRANCH}", pair["toml"])
                  if None in (js_main, toml_main, js_pr, toml_pr):
                      continue
                  try:
                      main_meta = (
                          get_js_timestamp(js_main),
                          get_toml_field(toml_main, "package", "version"),
                          get_toml_field(toml_main, "config.update_timestamp", "default"),
                      )
                      pr_meta = (
                          get_js_timestamp(js_pr),
                          get_toml_field(toml_pr, "package", "version"),
                          get_toml_field(toml_pr, "config.update_timestamp", "default"),
                      )
                  except ValueError:
                      continue
                  if main_meta != pr_meta:
                      pending_groups.add(pair["name"])

          selected = changed_groups | pending_groups

          report_lines = []
          changed_files_count = 0
          failed_count = 0

          if not selected:
              report_lines.append("ℹ️ 本次 push 没有业务变化，也没有需要保留的 PR 内容，跳过。")
          else:
              timestamp = str(int(time.time()))

              for pair in PAIRS:
                  name = pair["name"]

                  if name not in selected:
                      report_lines.append(f"ℹ️ 跳过（本次不涉及）：`{name}`")
                      continue

                  try:
                      js_path = Path(pair["js"])
                      toml_path = Path(pair["toml"])

                      js = js_path.read_text(encoding="utf-8")
                      toml = toml_path.read_text(encoding="utf-8")

                      if name in changed_groups:
                          ts = timestamp
                      elif branch_exists:
                          js_pr = read_ref(f"origin/{BRANCH}", pair["js"])
                          ts = get_js_timestamp(js_pr)
                      else:
                          ts = timestamp

                      js = set_js_timestamp(js, ts)

                      main_toml = read_ref("HEAD", pair["toml"])
                      main_version = get_toml_field(main_toml, "package", "version")
                      new_version = increment_version(main_version)

                      toml = set_toml_field(toml, "package", "version", new_version)
                      toml = set_toml_field(
                          toml, "config.update_timestamp",
                          "default", ts,
                      )

                      js_path.write_text(js, encoding="utf-8")
                      toml_path.write_text(toml, encoding="utf-8")

                      changed_files_count += 1
                      report_lines.append(
                          f"✅ `{name}`：version → `{new_version}`，timestamp → `{ts}`"
                      )
                  except Exception as e:
                      failed_count += 1
                      report_lines.append(f"❌ `{name}` 处理失败：{e}")

          report_text = "\n".join(report_lines) if report_lines else "（无内容）"

          # 写 Actions Summary（无论有没有 PR 都能看到）
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("## Update Timestamp 处理结果\n\n")
                  f.write(report_text + "\n")

          # 写 GITHUB_OUTPUT
          has_changes = changed_files_count > 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"has_changes={'true' if has_changes else 'false'}\n")
              f.write(f"changed_count={changed_files_count}\n")
              f.write(f"failed_count={failed_count}\n")
              f.write("report<<UPDATE_TIMESTAMP_REPORT_EOF\n")
              f.write(report_text + "\n")
              f.write("UPDATE_TIMESTAMP_REPORT_EOF\n")

          # 如果有失败，退出码非 0，让 workflow 标红
          if failed_count > 0:
              print(f"有 {failed_count} 个 pair 处理失败")
              raise SystemExit(1)
          PY

      - name: Create or update PR
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/update-timestamp
          delete-branch: true
          title: "chore: update Timestamp"
          commit-message: "chore: update timestamps and versions"
          add-paths: |
            dice/sealpack/countlog/scripts/countlog.js
            dice/sealpack/countlog/info.toml
            dice/sealpack/er_update/scripts/er-update.js
            dice/sealpack/er_update/info.toml
            dice/sealpack/pt_plan/scripts/ptplan.js
            dice/sealpack/pt_plan/info.toml
            dice/sealpack/silence/scripts/a_silence.js
            dice/sealpack/silence/info.toml
          body: |
            Automatically updates Timestamp for changed JS files.
            Please review before merging.

            ## 处理结果

            ${{ steps.update.outputs.report }}