name: KP - Sync

on:
  push:
    branches:
      - main
    paths:
      - 'dice/oliva/kp_all/kp_groupMap.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch existing PR branch
        run: |
          git fetch origin \
            automation/update-group-map:refs/remotes/origin/automation/update-group-map \
            2>/dev/null || true

      - name: Check whether an update PR is open
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list \
            --base main \
            --head automation/update-group-map \
            --state open \
            --json number \
            --jq 'length')
          echo "open=$count" >> "$GITHUB_OUTPUT"

      - name: Sync group map and metadata
        id: sync
        env:
          BEFORE_SHA: ${{ github.event.before }}
          OPEN_PR: ${{ steps.pr.outputs.open }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          JSON_PATH = "dice/oliva/kp_all/kp_groupMap.json"
          JS_PATH = "dice/sealpack/kp_all/scripts/a_kp_all.js"
          TOML_PATH = "dice/sealpack/kp_all/info.toml"
          PR_BRANCH = "origin/automation/update-group-map"

          def git_show(revision, path):
              return subprocess.check_output(
                  ["git", "show", f"{revision}:{path}"],
                  text=True
              )

          def increment_version(version):
              match = re.fullmatch(
                  r"(\d+)\.(\d+)\.(\d+)",
                  version.strip()
              )
              if not match:
                  raise ValueError(
                      f"Unsupported version format: {version!r}"
                  )

              major, minor, patch = map(int, match.groups())
              patch += 1

              if patch > 9:
                  patch = 0
                  minor += 1

              if minor > 9:
                  minor = 0
                  major += 1

              return f"{major}.{minor}.{patch}"

          def get_toml_value(content, section, key):
              section_pattern = (
                  r"(?m)^[ \t]*\["
                  + re.escape(section)
                  + r"\][ \t]*$"
              )
              section_match = re.search(section_pattern, content)

              if not section_match:
                  raise ValueError(
                      f"TOML section not found: [{section}]"
                  )

              start = section_match.end()
              next_section = re.search(
                  r"(?m)^[ \t]*\[",
                  content[start:]
              )
              end = (
                  start + next_section.start()
                  if next_section
                  else len(content)
              )
              block = content[start:end]

              key_pattern = (
                  r'(?m)^[ \t]*'
                  + re.escape(key)
                  + r'[ \t]*=[ \t]*"([^"]*)"'
              )
              match = re.search(key_pattern, block)

              if not match:
                  raise ValueError(
                      f'Key "{key}" not found in [{section}]'
                  )

              return match.group(1)

          def replace_toml_value(content, section, key, value):
              section_pattern = (
                  r"(?m)^[ \t]*\["
                  + re.escape(section)
                  + r"\][ \t]*$"
              )
              section_match = re.search(section_pattern, content)

              if not section_match:
                  raise ValueError(
                      f"TOML section not found: [{section}]"
                  )

              start = section_match.end()
              next_section = re.search(
                  r"(?m)^[ \t]*\[",
                  content[start:]
              )
              end = (
                  start + next_section.start()
                  if next_section
                  else len(content)
              )
              block = content[start:end]

              key_pattern = (
                  r'(?m)^([ \t]*'
                  + re.escape(key)
                  + r'[ \t]*=[ \t]*)'
                  + r'("(?:\\.|[^"\\])*"|[^#\r\n]*)'
              )

              updated, count = re.subn(
                  key_pattern,
                  lambda m: m.group(1) + json.dumps(value),
                  block,
                  count=1
              )

              if count != 1:
                  raise ValueError(
                      f'Key "{key}" not found in [{section}]'
                  )

              return content[:start] + updated + content[end:]

          def to_js_object(value):
              text = json.dumps(
                  value,
                  ensure_ascii=False,
                  indent=4
              )

              # Remove quotes only from valid JS identifier keys.
              text = re.sub(
                  r'(?m)^(\s*)"([A-Za-z_$][A-Za-z0-9_$]*)":',
                  r'\1\2:',
                  text
              )
              return text

          # Read JSON and validate its structure.
          json_file = Path(JSON_PATH)
          json_text = json_file.read_text(encoding="utf-8")
          data = json.loads(json_text)

          if "group_map" not in data:
              raise ValueError("JSON does not contain group_map")

          if not isinstance(data["group_map"], dict):
              raise ValueError("group_map must be a JSON object")

          # Only sync when group_map actually changes.
          before_sha = os.environ["BEFORE_SHA"]
          old_group_map = None

          if before_sha and not re.fullmatch(r"0+", before_sha):
              try:
                  previous_json = json.loads(
                      git_show(before_sha, JSON_PATH)
                  )
                  old_group_map = previous_json.get("group_map")
              except (
                  subprocess.CalledProcessError,
                  json.JSONDecodeError,
                  AttributeError
              ):
                  old_group_map = None

          if old_group_map == data["group_map"]:
              print("group_map has not changed; skipping.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("changed=false\n")
              raise SystemExit(0)

          # Read main version.
          main_toml = Path(TOML_PATH).read_text(encoding="utf-8")
          main_version = get_toml_value(
              main_toml, "package", "version"
          )

          # Reuse the existing PR version when its PR is open.
          open_pr = os.environ.get("OPEN_PR", "0") == "1"
          version = None

          if open_pr:
              try:
                  pr_toml = git_show(PR_BRANCH, TOML_PATH)
                  version = get_toml_value(
                      pr_toml, "package", "version"
                  )
              except (
                  subprocess.CalledProcessError,
                  ValueError
              ):
                  version = None

          if version is None or version == main_version:
              version = increment_version(main_version)

          # Unix timestamp in seconds, e.g. 1790523146.
          timestamp = str(int(time.time()))

          # Update ONLY the numeric JSON timestamp.
          # All other JSON text, formatting, and ver remain untouched.
          timestamp_pattern = re.compile(
              r'("timestamp"\s*:\s*)\d+'
          )

          updated_json_text, timestamp_count = (
              timestamp_pattern.subn(
                  lambda m: m.group(1) + timestamp,
                  json_text,
                  count=1
              )
          )

          if timestamp_count != 1:
              raise ValueError(
                  "Could not find a numeric JSON timestamp"
              )

          # Replace the complete JS groupMap object.
          js_file = Path(JS_PATH)
          js_text = js_file.read_text(encoding="utf-8")

          group_map_pattern = re.compile(
              r'(?ms)^([ \t]*const[ \t]+groupMap[ \t]*=[ \t]*)'
              r'\{.*?^[ \t]*\};'
          )

          js_text, group_count = group_map_pattern.subn(
              lambda m: (
                  m.group(1)
                  + to_js_object(data["group_map"])
                  + ";"
              ),
              js_text,
              count=1
          )

          if group_count != 1:
              raise ValueError(
                  "Could not find const groupMap = { ... };"
              )

          # Update the JS timestamp; leave JS ver untouched.
          js_timestamp_pattern = re.compile(
              r"(?m)^[ \t]*//[ \t]*@timestamp\b.*$"
          )

          js_text, js_timestamp_count = (
              js_timestamp_pattern.subn(
                  "// @timestamp " + timestamp,
                  js_text,
                  count=1
              )
          )

          if js_timestamp_count != 1:
              raise ValueError(
                  "Could not find the JS // @timestamp line"
              )

          # Update TOML version and timestamp default.
          toml_text = replace_toml_value(
              main_toml,
              "package",
              "version",
              version
          )
          toml_text = replace_toml_value(
              toml_text,
              "config.update_timestamp",
              "default",
              timestamp
          )

          # Write files only after all replacements succeeded.
          json_file.write_text(
              updated_json_text,
              encoding="utf-8"
          )
          js_file.write_text(js_text, encoding="utf-8")
          Path(TOML_PATH).write_text(
              toml_text,
              encoding="utf-8"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("changed=true\n")

          print(f"group_map synced; version={version}")
          print(f"timestamp={timestamp}")
          PY

      - name: Create or update pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/update-group-map
          delete-branch: true
          commit-message: "chore: sync group map and metadata"
          title: "chore: sync group map and metadata"
          body: |
            Automatically synchronizes group_map from
            dice/oliva/kp_all/kp_groupMap.json into
            dice/sealpack/kp_all/scripts/a_kp_all.js.

            Updates JSON and JS timestamps using Unix time
            in seconds, and updates info.toml metadata.

            Please review before merging.
          add-paths: |
            dice/oliva/kp_all/kp_groupMap.json
            dice/sealpack/kp_all/scripts/a_kp_all.js
            dice/sealpack/kp_all/info.toml