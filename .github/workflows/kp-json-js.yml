name: KP - Sync

on:
  push:
    branches:
      - main
    paths:
      - 'dice/oliva/kp_all/kp_groupMap.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch existing PR branch
        run: |
          git fetch origin \
            automation/update-group-map:refs/remotes/origin/automation/update-group-map \
            2>/dev/null || true

      - name: Check whether an update PR is open
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          info=$(gh pr list \
            --base main \
            --head automation/update-group-map \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$info" ]; then
            echo "open=1"        >> "$GITHUB_OUTPUT"
            echo "number=$info"  >> "$GITHUB_OUTPUT"
          else
            echo "open=0"   >> "$GITHUB_OUTPUT"
            echo "number="  >> "$GITHUB_OUTPUT"
          fi

      - name: Sync group map and metadata
        id: sync
        env:
          BEFORE_SHA: ${{ github.event.before }}
          OPEN_PR:    ${{ steps.pr.outputs.open }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          JSON_PATH   = "dice/oliva/kp_all/kp_groupMap.json"
          JS_PATH     = "dice/sealpack/kp_all/scripts/a_kp_all.js"
          TOML_PATH   = "dice/sealpack/kp_all/info.toml"
          PR_BRANCH   = "origin/automation/update-group-map"
          REPORT_PATH = "sync_report.md"

          # ---------------- 工具 ----------------
          def git_show(rev, path):
              return subprocess.check_output(
                  ["git", "show", f"{rev}:{path}"], text=True
              )

          def increment_version(version):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version.strip())
              if not m:
                  raise ValueError(f"Unsupported version: {version!r}")
              major, minor, patch = map(int, m.groups())
              patch += 1
              if patch > 9:
                  patch = 0
                  minor += 1
              if minor > 9:
                  minor = 0
                  major += 1
              return f"{major}.{minor}.{patch}"

          def get_toml_value(content, section, key):
              sec = re.search(
                  r"(?m)^[ \t]*\[" + re.escape(section) + r"\][ \t]*$",
                  content,
              )
              if not sec:
                  raise ValueError(f"TOML section not found: [{section}]")
              start = sec.end()
              nxt = re.search(r"(?m)^[ \t]*\[", content[start:])
              end = start + nxt.start() if nxt else len(content)
              block = content[start:end]
              m = re.search(
                  r'(?m)^[ \t]*' + re.escape(key) + r'[ \t]*=[ \t]*"([^"]*)"',
                  block,
              )
              if not m:
                  raise ValueError(f'Key "{key}" not in [{section}]')
              return m.group(1)

          def replace_toml_value(content, section, key, value):
              sec = re.search(
                  r"(?m)^[ \t]*\[" + re.escape(section) + r"\][ \t]*$",
                  content,
              )
              if not sec:
                  raise ValueError(f"TOML section not found: [{section}]")
              start = sec.end()
              nxt = re.search(r"(?m)^[ \t]*\[", content[start:])
              end = start + nxt.start() if nxt else len(content)
              block = content[start:end]
              pattern = (
                  r'(?m)^([ \t]*' + re.escape(key) + r'[ \t]*=[ \t]*)'
                  + r'("(?:\\.|[^"\\])*"|[^#\r\n]*)'
              )
              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + json.dumps(value),
                  block, count=1,
              )
              if count != 1:
                  raise ValueError(f'Key "{key}" not found in [{section}]')
              return content[:start] + updated + content[end:]

          # ---------------- JS 紧凑格式 ----------------
          def js_key(key):
              return json.dumps(key, ensure_ascii=False)

          def js_val(val):
              parts = [
                  f'groupNumber:{json.dumps(val["groupNumber"], ensure_ascii=False)}'
              ]
              if val.get("aliases"):
                  parts.append(
                      f'aliases:{json.dumps(val["aliases"], ensure_ascii=False)}'
                  )
              if val.get("series"):
                  parts.append(
                      f'series:{json.dumps(val["series"], ensure_ascii=False)}'
                  )
              return "{" + ",".join(parts) + "}"

          def to_js_object(mapping):
              keys = sorted(mapping.keys(), key=lambda s: s.lower())
              lines = ["{"]
              for i, k in enumerate(keys):
                  comma = "," if i < len(keys) - 1 else ""
                  lines.append(
                      f'    {js_key(k)}: {js_val(mapping[k])}{comma}'
                  )
              lines.append("}")
              return "\n".join(lines)

          # ---------------- 读 JSON ----------------
          json_file = Path(JSON_PATH)
          data = json.loads(json_file.read_text(encoding="utf-8"))
          if "group_map" not in data or not isinstance(data["group_map"], dict):
              raise ValueError("group_map missing / not an object")

          # ---------------- 排序 ----------------
          sorted_keys = sorted(data["group_map"].keys(), key=lambda s: s.lower())
          sorted_map  = {k: data["group_map"][k] for k in sorted_keys}

          # ---------------- 重复检测 ----------------
          report = []

          num_to_keys = {}
          for k, v in sorted_map.items():
              for token in re.split(r"[、\n*]", str(v.get("groupNumber", ""))):
                  token = token.strip()
                  if re.fullmatch(r"\d+", token):
                      num_to_keys.setdefault(token, []).append(k)

          dup_num = {n: ks for n, ks in num_to_keys.items() if len(ks) > 1}
          if dup_num:
              report.append("### ⚠️ 重复群号")
              for n, ks in sorted(dup_num.items()):
                  report.append(
                      f"- `{n}`：{'、'.join(f'`{k}`' for k in ks)}"
                  )

          alias_to_keys = {}
          for k, v in sorted_map.items():
              for a in v.get("aliases") or []:
                  alias_to_keys.setdefault(a, []).append(k)

          dup_alias = {a: ks for a, ks in alias_to_keys.items() if len(ks) > 1}
          if dup_alias:
              report.append("### ⚠️ 重复别名")
              for a, ks in sorted(dup_alias.items()):
                  report.append(
                      f"- `{a}`：{'、'.join(f'`{k}`' for k in ks)}"
                  )

          report_text = "\n".join(report) if report else "✅ 未发现重复项"
          Path(REPORT_PATH).write_text(report_text, encoding="utf-8")

          # ---------------- 是否真的变化 ----------------
          before_sha = os.environ.get("BEFORE_SHA", "")
          old_sorted = None
          if before_sha and not re.fullmatch(r"0+", before_sha):
              try:
                  prev = json.loads(git_show(before_sha, JSON_PATH))
                  pm   = prev.get("group_map", {})
                  old_sorted = {
                      k: pm[k]
                      for k in sorted(pm.keys(), key=lambda s: s.lower())
                  }
              except (
                  subprocess.CalledProcessError,
                  json.JSONDecodeError,
                  AttributeError,
              ):
                  old_sorted = None

          if old_sorted == sorted_map:
              print("group_map unchanged; skip.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("changed=false\n")
              raise SystemExit(0)

          # ---------------- 版本号 ----------------
          main_toml    = Path(TOML_PATH).read_text(encoding="utf-8")
          main_version = get_toml_value(main_toml, "package", "version")

          open_pr = os.environ.get("OPEN_PR", "0") == "1"
          version = None
          if open_pr:
              try:
                  pr_toml = git_show(PR_BRANCH, TOML_PATH)
                  version = get_toml_value(pr_toml, "package", "version")
              except (subprocess.CalledProcessError, ValueError):
                  version = None

          if version is None or version == main_version:
              version = increment_version(main_version)

          timestamp = str(int(time.time()))

          # ---------------- 写回 JSON（group_map 一行一条） ----------------
          def build_json_text(data, sorted_map, timestamp):
              parts = ["{"]
              other_keys = [k for k in data.keys() if k != "group_map"]
              for k in other_keys:
                  v = data[k]
                  if k == "timestamp":
                      v = int(timestamp)
                  parts.append(
                      f'  {json.dumps(k, ensure_ascii=False)}: '
                      f'{json.dumps(v, ensure_ascii=False)},'
                  )
              parts.append('  "group_map": {')
              keys = sorted(sorted_map.keys(), key=lambda s: s.lower())
              for i, k in enumerate(keys):
                  comma = "," if i < len(keys) - 1 else ""
                  v = sorted_map[k]
                  val_parts = [
                      f'"groupNumber": {json.dumps(v["groupNumber"], ensure_ascii=False)}'
                  ]
                  if v.get("aliases"):
                      val_parts.append(
                          f'"aliases": {json.dumps(v["aliases"], ensure_ascii=False)}'
                      )
                  if v.get("series"):
                      val_parts.append(
                          f'"series": {json.dumps(v["series"], ensure_ascii=False)}'
                      )
                  val_str = "{" + ", ".join(val_parts) + "}"
                  parts.append(
                      f'    {json.dumps(k, ensure_ascii=False)}: {val_str}{comma}'
                  )
              parts.append("  }")
              parts.append("}")
              return "\n".join(parts) + "\n"

          json_file.write_text(
              build_json_text(data, sorted_map, timestamp),
              encoding="utf-8",
          )

          # ---------------- 写回 JS ----------------
          js_file = Path(JS_PATH)
          js_text = js_file.read_text(encoding="utf-8")

          group_map_pattern = re.compile(
              r'(?ms)^([ \t]*const[ \t]+groupMap[ \t]*=[ \t]*)'
              r'\{.*?^[ \t]*\};'
          )
          js_text, n = group_map_pattern.subn(
              lambda m: m.group(1) + to_js_object(sorted_map) + ";",
              js_text, count=1,
          )
          if n != 1:
              raise ValueError("Could not find const groupMap = { ... };")

          js_text, n = re.subn(
              r"(?m)^[ \t]*//[ \t]*@timestamp\b.*$",
              "// @timestamp    " + timestamp,
              js_text, count=1,
          )
          if n != 1:
              raise ValueError("Could not find JS // @timestamp line")

          js_file.write_text(js_text, encoding="utf-8")

          # ---------------- 写回 TOML ----------------
          toml_text = replace_toml_value(main_toml, "package", "version", version)
          toml_text = replace_toml_value(
              toml_text, "config.update_timestamp", "default", timestamp
          )
          Path(TOML_PATH).write_text(toml_text, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("changed=true\n")
              f.write(f"version={version}\n")
              f.write(f"timestamp={timestamp}\n")

          print(f"synced: version={version} ts={timestamp}")
          PY

      - name: Create or update pull request
        id: cpr
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/update-group-map
          delete-branch: true
          commit-message: "chore: sync group map and metadata"
          title: "chore: sync group map and metadata"
          body: |
            Automatically synchronizes `group_map` from
            `dice/oliva/kp_all/kp_groupMap.json` into
            `dice/sealpack/kp_all/scripts/a_kp_all.js`.

            - JSON 会按 key 排序后重写
            - 同步 JSON / JS 的 timestamp
            - 更新 `info.toml` 的 version 与 timestamp

            Please review before merging.
          add-paths: |
            dice/oliva/kp_all/kp_groupMap.json
            dice/sealpack/kp_all/scripts/a_kp_all.js
            dice/sealpack/kp_all/info.toml

      - name: Build PR comment body
        if: steps.sync.outputs.changed == 'true'
        run: |
          {
            echo "🔄 **Sync ${{ steps.cpr.outputs.pull-request-operation }}**"
            echo ""
            echo "- version: \`${{ steps.sync.outputs.version }}\`"
            echo "- timestamp: \`${{ steps.sync.outputs.timestamp }}\`"
            echo ""
            echo "**同步报告**"
            echo ""
            if [ -f sync_report.md ]; then
              cat sync_report.md
            else
              echo "（未生成报告）"
            fi
          } > pr_comment.md
          echo "----- PR comment body -----"
          cat pr_comment.md

      - name: Comment on PR
        if: |
          steps.sync.outputs.changed == 'true'
          && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.cpr.outputs.pull-request-number }}" \
            --body-file pr_comment.md