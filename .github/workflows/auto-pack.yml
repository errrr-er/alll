name: Auto Pack - Auto Check Daily

on:
  # 每天北京时间 00:00 检查一次，减少 Actions 运行次数
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Asia/Shanghai'
  # 需要时可以在 Actions 页面手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pack files unchanged for 24 hours
        env:
          # 每行一项，格式为：仓库内源文件路径|生成的 ZIP 文件名
          # 路径使用 /，每个源文件会单独生成一个 ZIP。
          PACK_TARGETS: |
            dice/sealpack/kp_all/scripts/a_kp_all.js|seal_kp.zip

          # 用默认分支第一父链上最近一次改动该文件的提交时间计时。
          # 内容未变化且 ZIP 已存在时不重打包，避免每天重复提交。
          # ZIP 内只放当前源文件，不把其它配置文件一起打包。
        run: |
          python - <<'PY'
          import os
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          WAIT_SECONDS = 24 * 60 * 60
          now = int(time.time())
          output_dir = Path("auto_pack")
          output_dir.mkdir(parents=True, exist_ok=True)

          targets = os.environ.get("PACK_TARGETS", "")
          for line in targets.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue

              if "|" not in line:
                  print(f"配置格式错误，已跳过：{line}")
                  continue

              source_text, zip_name = (part.strip() for part in line.split("|", 1))
              source = Path(source_text)
              if not zip_name.endswith(".zip") or Path(zip_name).name != zip_name:
                  print(f"ZIP 文件名必须是简单的 .zip 文件名，已跳过：{zip_name}")
                  continue

              if not source.is_file():
                  print(f"源文件不存在，已跳过：{source.as_posix()}")
                  continue

              result = subprocess.run(
                  ["git", "log", "--first-parent", "-1", "--format=%ct", "--", source.as_posix()],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              timestamp_text = result.stdout.strip()
              if not timestamp_text:
                  print(f"找不到文件的 Git 提交记录，已跳过：{source.as_posix()}")
                  continue

              last_changed = int(timestamp_text)
              elapsed = now - last_changed
              if elapsed < WAIT_SECONDS:
                  remaining_hours = (WAIT_SECONDS - elapsed) / 3600
                  print(f"尚未静置满 24 小时：{source.as_posix()}（还需约 {remaining_hours:.1f} 小时）")
                  continue

              archive_path = output_dir / zip_name
              source_bytes = source.read_bytes()

              if archive_path.is_file() and zipfile.is_zipfile(archive_path):
                  try:
                      with zipfile.ZipFile(archive_path, "r") as old_zip:
                          names = old_zip.namelist()
                          if names == [source.name] and old_zip.read(source.name) == source_bytes:
                              print(f"ZIP 已是最新，无需操作：{archive_path.as_posix()}")
                              continue
                  except (OSError, KeyError, zipfile.BadZipFile):
                      pass

              temporary_path = archive_path.with_name(archive_path.name + ".tmp")
              try:
                  with zipfile.ZipFile(temporary_path, "w", compression=zipfile.ZIP_DEFLATED) as new_zip:
                      new_zip.writestr(source.name, source_bytes)
                  os.replace(temporary_path, archive_path)
              finally:
                  if temporary_path.exists():
                      temporary_path.unlink()

              print(f"已生成：{archive_path.as_posix()}（仅包含 {source.name}）")
          PY

      - name: Commit updated ZIPs to the repository
        run: |
          git add auto_pack/
          if git diff --cached --quiet; then
            echo "没有新的 ZIP 需要提交。"
            exit 0
          fi
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-pack stable files"
          git push
