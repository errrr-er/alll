name: 0 am - Pack

on:
  schedule:
    # UTC 16:00 = 北京时间 00:00
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack stable files
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # 格式：源路径|中间zip名|最终文件名
          PACK_TARGETS: |
            dice/sealpack/kp_all/scripts/a_kp_all.js|seal_kp.zip|seal_kp.zip
            call_of_cthulhu/kp/oliva_kp_all|oliva_kp.zip|oliva_kp.opk
            dice_common/silence/a_silence.js|seal_silence.zip|seal_silence.zip
            dice_common/multi_reply/multi.html|seal_multi.zip|seal_multi.zip
            dice_common/record_result/countlog.js|seal_countlog.zip|seal_countlog.zip
            dice_common/pt_plan/ptplan.js|seal_ptplan.zip|seal_ptplan.zip
        run: |
          python - <<'PY'
          import os
          import subprocess
          import time
          import zipfile
          from collections import Counter
          from pathlib import Path

          WAIT_SECONDS  = 24 * 60 * 60   # 源文件需静置多久才打包
          FORCE_SECONDS = 24 * 60 * 60   # 距上次打包最多拖多久（兜底）

          # 手动触发时强制打包（忽略 24h 规则），需要的话保留；不需要可以删
          FORCE_MANUAL = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"

          now = int(time.time())
          output_dir = Path("dice/auto_pack")
          output_dir.mkdir(parents=True, exist_ok=True)

          FIXED_DATE = (2020, 1, 1, 0, 0, 0)

          def git_last_change(path: Path):
              if not path.exists():
                  return None
              result = subprocess.run(
                  ["git", "log", "--first-parent", "-1", "--format=%ct", "--", str(path)],
                  capture_output=True, text=True, check=True,
              )
              t = result.stdout.strip()
              return int(t) if t else None

          def collect_files(source: Path):
              if source.is_file():
                  return [(source.name, source.read_bytes())]
              if source.is_dir():
                  items = []
                  for p in sorted(source.rglob("*")):
                      if p.is_file():
                          items.append((p.name, p.read_bytes()))
                  return items
              return None

          def zip_matches(archive_path: Path, items):
              if not archive_path.is_file() or not zipfile.is_zipfile(archive_path):
                  return False
              try:
                  with zipfile.ZipFile(archive_path, "r") as z:
                      if sorted(z.namelist()) != sorted(n for n, _ in items):
                          return False
                      for name, data in items:
                          if z.read(name) != data:
                              return False
                      return True
              except (OSError, KeyError, zipfile.BadZipFile):
                  return False

          def write_zip(archive_path: Path, items):
              tmp = archive_path.with_name(archive_path.name + ".tmp")
              try:
                  with zipfile.ZipFile(tmp, "w", compression=zipfile.ZIP_DEFLATED) as z:
                      for name, data in items:
                          info = zipfile.ZipInfo(name, date_time=FIXED_DATE)
                          info.compress_type = zipfile.ZIP_DEFLATED
                          z.writestr(info, data)
                  os.replace(tmp, archive_path)
              finally:
                  if tmp.exists():
                      tmp.unlink()

          targets = os.environ.get("PACK_TARGETS", "")
          for line in targets.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue

              parts = [p.strip() for p in line.split("|")]
              if len(parts) != 3:
                  print(f"格式错误（需 源|中间zip名|最终名）：{line}")
                  continue

              source_text, zip_name, final_name = parts
              source = Path(source_text)

              if Path(zip_name).name != zip_name or Path(final_name).name != final_name:
                  print(f"文件名必须是简单文件名，跳过：{line}")
                  continue

              if not source.exists():
                  print(f"源不存在，跳过：{source_text}")
                  continue

              items = collect_files(source)
              if items is None:
                  print(f"不是文件也不是目录，跳过：{source_text}")
                  continue

              names = [n for n, _ in items]
              dups = [n for n, c in Counter(names).items() if c > 1]
              if dups:
                  print(f"平铺后重名，跳过：{source_text} -> {dups}")
                  continue

              zip_path   = output_dir / zip_name
              final_path = output_dir / final_name

              # 最终产物是否存在（先看改名后的，再看中间 zip）
              exists = final_path.exists() or zip_path.exists()
              check_path = final_path if final_path.exists() else zip_path

              # 1. 不存在 → 直接打（首次/新目录，不看时间）
              if not exists:
                  write_zip(zip_path, items)
                  print(f"已生成（首次）：{zip_path.as_posix()}（{len(items)} 个文件）")
                  if final_path.name != zip_path.name:
                      if final_path.exists():
                          final_path.unlink()
                      os.replace(zip_path, final_path)
                      print(f"已重命名为：{final_path.as_posix()}")
                  continue

              # 2. 存在、内容一致 → 跳过
              if zip_matches(check_path, items):
                  print(f"内容未变，跳过：{source_text}")
                  continue

              # 3. 存在、内容不一致 → 判断时间
              source_last = git_last_change(source)
              if source_last is None:
                  print(f"无 git 记录，跳过：{source_text}")
                  continue

              zip_last = git_last_change(check_path)

              if FORCE_MANUAL:
                  ready = True
                  reason = "手动强制打包"
              else:
                  source_stable = (now - source_last) >= WAIT_SECONDS
                  zip_overdue = (
                      zip_last is not None
                      and (now - zip_last) >= FORCE_SECONDS
                  )
                  ready = source_stable or zip_overdue
                  if source_stable:
                      reason = "源文件已静置满 24 小时"
                  elif zip_overdue:
                      reason = "距上次打包已满 24 小时（兜底）"
                  else:
                      reason = None

              if not ready:
                  need_stable = (WAIT_SECONDS - (now - source_last)) / 3600
                  if zip_last is None:
                      print(f"等待中：{source_text}（源稳定还需 {need_stable:.1f}h）")
                  else:
                      need_zip = (FORCE_SECONDS - (now - zip_last)) / 3600
                      print(
                          f"等待中：{source_text}"
                          f"（源稳定还需 {need_stable:.1f}h，"
                          f"或强制打包还需 {need_zip:.1f}h）"
                      )
                  continue

              write_zip(zip_path, items)
              print(f"已生成：{zip_path.as_posix()}（{len(items)} 个文件，原因：{reason}）")
              if final_path.name != zip_path.name:
                  if final_path.exists():
                      final_path.unlink()
                  os.replace(zip_path, final_path)
                  print(f"已重命名为：{final_path.as_posix()}")
          PY

      - name: Commit updated packages
        run: |
          git add dice/auto_pack/
          if git diff --cached --quiet; then
            echo "没有新的包需要提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "auto pack"
          git pull --rebase
          git push