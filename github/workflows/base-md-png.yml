name: base md to png

on:
  workflow_dispatch:
  push:
    paths:
      - 'readme_pic/cat/**'
      - 'readme_pic/extension/**'
      - 'assets/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y pandoc fonts-noto-cjk imagemagick

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer locally
        run: npm install puppeteer

      - name: Prepare assets
        run: |
          for dir in readme_pic/*/; do
            mkdir -p "$dir/_assets_tmp"
            cp -r assets/* "$dir/_assets_tmp/"
          done

      - name: Get changed markdown files
        id: changes
        run: |
          git diff --name-only HEAD~1 HEAD | grep '\.md$' > changed.txt || true
          cat changed.txt

      - name: Convert changed MD to HTML
        run: |
          while read file; do
            [ -z "$file" ] && continue

            dir=$(dirname "$file")
            name=$(basename "$file" .md)

            pandoc "$file" \
              -f markdown \
              -t html5 \
              --standalone \
              --metadata title=" " \
              --css=_assets_tmp/styles/cat_readme.css \
              -o "$dir/$name.html"

          done < changed.txt

      - name: HTML to PNG (only changed)
        run: |
          while read file; do
            [ -z "$file" ] && continue

            dir=$(dirname "$file")
            name=$(basename "$file" .md)
            html="$dir/$name.html"
            png="$dir/$name.png"

            echo "Rendering $html -> $png"

            node -e "
              const puppeteer = require('puppeteer');
              (async () => {
                const browser = await puppeteer.launch({ headless: true, args: ['--no-sandbox', '--disable-gpu'] });
                const page = await browser.newPage();
                await page.setViewport({ width: 1920, height: 1080, deviceScaleFactor: 2 });
                await page.goto('file://' + process.cwd() + '/$html', { waitUntil: 'networkidle0' });
                await page.screenshot({ path: '$png', fullPage: true });
                await browser.close();
              })();
            "

            convert "$png" -fuzz 2% -trim +repage -bordercolor white -border 55x55 "$png"
          done < changed.txt

      - name: Cleanup temp files
        run: |
          find readme_pic -name "*.html" -delete
          find readme_pic -type d -name "_assets_tmp" -exec rm -rf {} + 2>/dev/null || true

      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add readme_pic/

          if ! git diff --cached --quiet; then
            git commit -m "md to png (incremental)"
            git push || (
              git pull --rebase origin main
              git push
            )
          else
            echo "No changes"
          fi
