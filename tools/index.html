<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具箱</title>
    <style>
        :root {
            --bg: #f8f6f3;
            --card-bg: #ffffff;
            --text: #2c2416;
            --text-secondary: #5f5542;
            --border: #d9cebb;
            --shadow: 0 2px 12px rgba(60,40,20,0.05);
            --shadow-hover: 0 6px 20px rgba(60,40,20,0.09);
            --radius: 10px;
            --radius-sm: 6px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: var(--font-sans);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 20px 32px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 28px;
        }
        .page-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #3d2e1c;
            letter-spacing: 0.04em;
        }
        .page-header p {
            font-size: 0.83rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .tools-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tool-row {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: inherit;
            transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
        }
        .tool-row:hover {
            box-shadow: var(--shadow-hover);
            border-color: #c9b896;
            transform: translateY(-1px);
        }

        .tool-info {
            flex: 1;
            min-width: 0;
        }
        .tool-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #3d2e1c;
        }
        .tool-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tool-badge {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            background: #eee4d5;
            color: #5f4e34;
            padding: 3px 9px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .tool-arrow {
            font-size: 0.9rem;
            color: #c4a882;
            flex-shrink: 0;
            transition: transform 0.2s, color 0.2s;
        }
        .tool-row:hover .tool-arrow {
            transform: translateX(3px);
            color: #8b6a42;
        }

        .footer {
            margin-top: 28px;
            font-size: 0.78rem;
            color: #c0ae96;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>工具箱</h1>
            <p>实用工具集合，所有工具均在本地运行</p>
        </div>

        <div class="tools-list">
            <a href="./dice_common/multi_reply/multi.html" class="tool-row">
                <div class="tool-info">
                    <div class="tool-name">多套回复生成器</div>
                    <div class="tool-desc">生成多套条件分支回复文案，适配海豹 v1 / v2 引擎</div>
                </div>
                <span class="tool-badge">常用</span>
                <span class="tool-arrow">→</span>
            </a>

            <a href="./tools/webpages/br.html" class="tool-row">
                <div class="tool-info">
                    <div class="tool-name">段落 &lt;br&gt; 生成器</div>
                    <div class="tool-desc">将纯文本转换为带 &lt;br&gt; 标签的格式，同时输出纯文字版本</div>
                </div>
                <span class="tool-arrow">→</span>
            </a>

            <a href="./tools/webpages/csv.html" class="tool-row">
                <div class="tool-info">
                    <div class="tool-name">JSON → CSV 转换器</div>
                    <div class="tool-desc">将 JSON 键值对转换为 CSV 格式，方便用 Excel 或 Sheets 处理</div>
                </div>
                <span class="tool-arrow">→</span>
            </a>
        </div>

        <p class="footer">CC-BY-NC-SA 4.0</p>
    </div>
</body>
</html>
