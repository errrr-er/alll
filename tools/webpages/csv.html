<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON → CSV 转换器</title>
<style>
    :root {
        --bg: #f8f6f3;
        --card-bg: #ffffff;
        --text: #2c2416;
        --text-secondary: #5f5542;
        --border: #d9cebb;
        --shadow: 0 2px 12px rgba(60,40,20,0.05);
        --radius: 10px;
        --radius-sm: 6px;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Menlo', 'PingFang SC', 'Microsoft YaHei', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: var(--bg);
        font-family: var(--font-sans);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        padding: 24px 20px;
        -webkit-font-smoothing: antialiased;
    }

    .page-header {
        margin-bottom: 20px;
    }
    .page-header h1 {
        font-size: 1.3rem;
        font-weight: 600;
        color: #3d2e1c;
        letter-spacing: 0.03em;
    }
    .page-header p {
        font-size: 0.82rem;
        color: var(--text-secondary);
        margin-top: 2px;
    }

    .layout {
        display: flex;
        gap: 16px;
        align-items: flex-start;
    }

    .col {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        box-shadow: var(--shadow);
    }

    .card-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-secondary);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    textarea {
        width: 100%;
        height: 380px;
        border: 1.5px solid #ddd2c2;
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        font-size: 0.88rem;
        font-family: var(--font-mono);
        background: #fdfbf7;
        color: var(--text);
        resize: vertical;
        line-height: 1.6;
        transition: border-color 0.2s;
    }
    textarea:focus { outline: none; border-color: #b8976e; background: #fff; }
    textarea::placeholder { color: #c0b09a; font-family: var(--font-sans); }

    pre {
        font-family: var(--font-mono);
        font-size: 0.88rem;
        background: #fefcf8;
        border: 1.5px solid #e8e0d2;
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        white-space: pre-wrap;
        word-break: break-all;
        height: 380px;
        overflow-y: auto;
        color: var(--text);
        line-height: 1.6;
    }
    pre:empty::before { content: '等待生成…'; color: #c0b09a; font-style: italic; font-family: var(--font-sans); }
    pre.error { color: #a04030; background: #fff8f6; border-color: #e8c8c0; }

    .btn-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
    }

    .btn {
        padding: 9px 18px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
        font-family: inherit;
        letter-spacing: 0.02em;
        transition: all 0.18s;
        white-space: nowrap;
    }
    .btn-primary { background: #7d5d3c; color: #fff; }
    .btn-primary:hover { background: #5a3e28; transform: translateY(-1px); }
    .btn-ghost { background: #fefcf8; color: #5a3e28; border: 1.5px solid #c9b896; }
    .btn-ghost:hover { background: #5a3e28; color: #fff; border-color: #5a3e28; transform: translateY(-1px); }
    .btn.copied { background: #4a7c5c !important; color: #fff !important; border-color: #4a7c5c !important; pointer-events: none; }

    .toast {
        position: fixed;
        top: 20px; left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: #3d2e1c; color: #fff;
        padding: 9px 20px;
        border-radius: 20px;
        font-size: 0.88rem; font-weight: 500;
        z-index: 999;
        transition: transform 0.3s;
        pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
        .layout { flex-direction: column; }
    }
</style>
</head>
<body>

<div class="page-header">
    <h1>JSON → CSV 转换器</h1>
    <p>将 JSON 键值对转换为 CSV 格式，方便用 Excel 或 Sheets 处理</p>
</div>

<div class="layout">
    <!-- 左：输出 -->
    <div class="col">
        <div class="card">
            <div class="card-label">CSV 输出</div>
            <pre id="csvOutput"></pre>
            <div class="btn-group">
                <button class="btn btn-ghost" id="btn-copy" onclick="copyCSV()">复制 CSV</button>
            </div>
        </div>
    </div>

    <!-- 右：输入 -->
    <div class="col">
        <div class="card">
            <div class="card-label">JSON 输入</div>
            <textarea id="jsonInput" placeholder="粘贴你的 JSON 数据"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="convertJSONtoCSV()">生成 CSV</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
function convertJSONtoCSV() {
    let input = document.getElementById('jsonInput').value;
    const el = document.getElementById('csvOutput');
    let output = '';
    try {
        let data = JSON.parse(input);
        for (let key in data) {
            if (data[key] !== "" && data[key] !== null && data[key] !== undefined) {
                output += `${key}, ${data[key]},zh-CN\n`;
            }
        }
        el.textContent = output;
        el.classList.remove('error');
    } catch (e) {
        el.textContent = 'JSON 解析错误，请检查格式';
        el.classList.add('error');
    }
}
function copyCSV() {
    const csvText = document.getElementById('csvOutput').textContent;
    if (!csvText || csvText === 'JSON 解析错误，请检查格式') return;
    navigator.clipboard.writeText(csvText).then(() => {
        const btn = document.getElementById('btn-copy');
        btn.textContent = '已复制'; btn.classList.add('copied');
        showToast('复制成功');
        setTimeout(() => { btn.textContent = '复制 CSV'; btn.classList.remove('copied'); }, 1800);
    });
}
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
</body>
</html>
